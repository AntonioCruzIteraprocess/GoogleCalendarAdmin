<div id="page-settings" class="page">
  <h1 class="page-title">⚙️ Configuración</h1>
  <div class="card">
    <h3 style="margin-bottom:12px;">📊 Fuente de datos</h3>
    <div class="form-group">
      <label>Spreadsheet ID</label>
      <input type="text" id="dash-spreadsheet-id" placeholder="ID del Google Spreadsheet (el mismo del Extractor)">
    </div>
    <div class="form-group">
      <label>Nombre de la hoja</label>
      <input type="text" id="dash-sheet-name" placeholder="Reporte">
    </div>
    <p style="font-size:11px; color:#888; margin-bottom:12px;">Usa el mismo Spreadsheet que genera el Extractor del proyecto principal.</p>
    <button class="btn btn-success" onclick="saveDashConfig()">💾 Guardar</button>
  </div>
</div>
