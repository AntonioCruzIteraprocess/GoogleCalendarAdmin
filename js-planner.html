<script>
// ─── PLANIFICADOR ────────────────────────────────────────

function getPlannerParams() {
  return {
    dateFrom: document.getElementById("plannerFrom").value,
    dateTo: document.getElementById("plannerTo").value,
    hourFrom: parseInt(document.getElementById("plannerHourFrom").value),
    hourTo: parseInt(document.getElementById("plannerHourTo").value)
  };
}

function plannerSimulateUI() {
  var p = getPlannerParams();
  if (!p.dateFrom || !p.dateTo) return toast("Selecciona ambas fechas", "error");
  document.getElementById("planner-results").innerHTML = '<div class="card" style="text-align:center; color:#666;">\u23f3 Simulando...</div>';
  google.script.run
    .withSuccessHandler(function(r){
      if (r.status === "empty") { document.getElementById("planner-results").innerHTML = '<div class="card">' + r.message + '</div>'; return; }
      var html = '<div class="card">';
      html += '<div style="margin-bottom:12px;"><span class="badge badge-blue">Sprint: ' + r.sprint + '</span></div>';
      html += '<div style="display:flex; gap:20px; margin-bottom:16px;">';
      html += '<div><span style="font-size:24px; font-weight:700;">' + r.tasks + '</span><br><span style="font-size:12px; color:#666;">Tareas</span></div>';
      html += '<div><span style="font-size:24px; font-weight:700;">' + r.totalHours + 'h</span><br><span style="font-size:12px; color:#666;">Total</span></div>';
      html += '<div><span style="font-size:24px; font-weight:700; color:#34a853;">' + r.scheduledHours + 'h</span><br><span style="font-size:12px; color:#666;">Caben</span></div>';
      if (r.overflowHours > 0) html += '<div><span style="font-size:24px; font-weight:700; color:#ea4335;">' + r.overflowHours + 'h</span><br><span style="font-size:12px; color:#666;">Overflow</span></div>';
      html += '</div>';

      html += '<h4 style="margin-bottom:8px;">Tareas</h4>';
      html += '<table><tr><th>Key</th><th>Resumen</th><th>SP</th><th>Horas</th><th>Prioridad</th><th>Estado</th></tr>';
      r.details.forEach(function(t){
        html += '<tr><td><span class="badge badge-blue">' + t.key + '</span></td><td style="font-size:12px;">' + t.summary + '</td><td>' + t.sp + '</td><td>' + t.hours + 'h</td><td>' + (t.priority || '') + '</td><td>' + (t.status || '') + '</td></tr>';
      });
      html += '</table>';

      if (r.schedule && r.schedule.length > 0) {
        html += '<h4 style="margin:16px 0 8px;">Bloques a agendar</h4>';
        html += '<table><tr><th>D\u00eda</th><th>Inicio</th><th>Fin</th><th>Duraci\u00f3n</th></tr>';
        r.schedule.forEach(function(s){
          html += '<tr><td>' + s.date + '</td><td>' + s.start + '</td><td>' + s.end + '</td><td>' + s.minutes + ' min</td></tr>';
        });
        html += '</table>';
      }
      html += '</div>';
      document.getElementById("planner-results").innerHTML = html;
    })
    .withFailureHandler(function(e){ document.getElementById("planner-results").innerHTML = ''; toast("Error: " + e.message, "error"); })
    .plannerSimulate(p.dateFrom, p.dateTo, p.hourFrom, p.hourTo);
}

function plannerSyncUI() {
  var p = getPlannerParams();
  if (!p.dateFrom || !p.dateTo) return toast("Selecciona ambas fechas", "error");
  if (!confirm("\u00bfSincronizar? Esto limpiar\u00e1 los eventos del rango y crear\u00e1 nuevos.")) return;
  document.getElementById("planner-results").innerHTML = '<div class="card" style="text-align:center; color:#666;">\u23f3 Sincronizando con Jira...</div>';
  google.script.run
    .withSuccessHandler(function(r){
      if (r.status === "empty") { document.getElementById("planner-results").innerHTML = '<div class="card">' + r.message + '</div>'; return; }
      var html = '<div class="card">';
      html += '<div style="margin-bottom:12px;"><span class="badge badge-green">\u2713 Sincronizado</span> <span class="badge badge-blue">Sprint: ' + r.sprint + '</span></div>';
      html += '<div style="display:flex; gap:20px;">';
      html += '<div><span style="font-size:24px; font-weight:700;">' + r.tasks + '</span><br><span style="font-size:12px; color:#666;">Tareas</span></div>';
      html += '<div><span style="font-size:24px; font-weight:700; color:#34a853;">' + r.scheduledHours + 'h</span><br><span style="font-size:12px; color:#666;">Agendadas</span></div>';
      html += '<div><span style="font-size:24px; font-weight:700; color:#666;">' + r.cleaned + '</span><br><span style="font-size:12px; color:#666;">Limpiados</span></div>';
      if (r.overflowHours > 0) html += '<div><span style="font-size:24px; font-weight:700; color:#ea4335;">' + r.overflowHours + 'h</span><br><span style="font-size:12px; color:#666;">Overflow</span></div>';
      html += '</div></div>';
      document.getElementById("planner-results").innerHTML = html;
      toast("\u2713 Sincronizado: " + r.scheduledHours + "h agendadas", "success");
    })
    .withFailureHandler(function(e){ document.getElementById("planner-results").innerHTML = ''; toast("Error: " + e.message, "error"); })
    .plannerSync(p.dateFrom, p.dateTo, p.hourFrom, p.hourTo);
}

function plannerCleanUI() {
  var p = getPlannerParams();
  if (!p.dateFrom || !p.dateTo) return toast("Selecciona ambas fechas", "error");
  if (!confirm("\u00bfEliminar eventos 'Actividades Provident' del " + p.dateFrom + " al " + p.dateTo + "?")) return;
  google.script.run
    .withSuccessHandler(function(r){
      toast("\u2713 " + r.deleted + " eventos eliminados (" + r.range + ")", "success");
      document.getElementById("planner-results").innerHTML = '';
    })
    .withFailureHandler(function(e){ toast("Error: " + e.message, "error"); })
    .plannerCleanRange(p.dateFrom, p.dateTo);
}
</script>
