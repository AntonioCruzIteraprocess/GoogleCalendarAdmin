<div id="page-extractor" class="page">
  <div class="page-header">
    <div>
      <div class="page-title">📊 Reporte Jira</div>
      <div class="page-subtitle" id="extractor-project-label">Extrae issues de Jira y los guarda en Google Sheets</div>
    </div>
    <div id="extractor-project-badge"></div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('extractor','ejecutar')">Ejecutar</div>
  </div>

  <div id="extractor-ejecutar" class="tab-panel active">
    <div class="card">
      <div class="card-title">🔍 Filtros de extracción</div>

      <!-- Filtros guardados -->
      <div class="form-row" style="margin-bottom:4px;">
        <div style="flex:2;">
          <label>Filtro guardado</label>
          <select id="extSavedFilter" onchange="loadSavedFilter()">
            <option value="">-- Nuevo filtro --</option>
          </select>
        </div>
        <div style="flex:0 0 auto; padding-top:1px;">
          <label>&nbsp;</label>
          <button class="btn btn-ghost btn-sm btn-icon" title="Eliminar filtro" onclick="deleteSavedFilter()">🗑️</button>
        </div>
      </div>
      <hr class="divider">

      <!-- Filtro de fecha -->
      <div class="form-group">
        <label>Filtrar fechas por</label>
        <select id="extFilterType">
          <option value="duedate">Fecha de vencimiento</option>
          <option value="originalDueDate">Original Due Date</option>
          <option value="any">Cualquiera (OR)</option>
          <option value="both">Ambas (AND)</option>
        </select>
      </div>
      <div class="form-row">
        <div><label>Desde</label><input type="date" id="extDateFrom"></div>
        <div><label>Hasta</label><input type="date" id="extDateTo"></div>
      </div>

      <!-- Filtros adicionales por campo -->
      <hr class="divider">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span class="section-title" style="margin:0;">Filtros adicionales por campo</span>
        <button class="btn btn-ghost btn-sm" onclick="addFieldFilter()">＋ Agregar</button>
      </div>
      <div id="ext-field-filters"></div>

      <!-- Acciones -->
      <hr class="divider">
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="extPreview()">🔍 Preview</button>
        <button class="btn btn-success" onclick="extRun()">💾 Extraer y guardar</button>
        <button class="btn btn-ghost btn-sm" style="margin-left:auto;" onclick="saveCurrentFilter()">
          ☆ Guardar filtro
        </button>
      </div>
    </div>

    <div id="ext-results"></div>
  </div>
</div>
