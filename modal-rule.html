<div class="modal-overlay" id="rule-modal">
  <div class="modal">
    <h2 class="modal-title" id="modal-title">Nueva regla</h2>
    <div class="form-group">
      <label>Nombre de la regla</label>
      <input type="text" id="rule-name" placeholder="Ej: Provident">
    </div>
    <div class="form-group">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <label style="margin:0;">Condiciones</label>
        <span style="font-size:11px; color:#888;">Grupos se evalúan con OR entre sí</span>
      </div>
      <div id="modal-conditions"></div>
    </div>
    <div class="form-group">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <label style="margin:0;">Etiquetas</label>
        <button class="btn btn-sm btn-primary" onclick="addModalLabel()">+ Agregar</button>
      </div>
      <div id="modal-labels"></div>
    </div>
    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
      <button class="btn" style="background:#eee;" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-success" onclick="saveRule()">Guardar regla</button>
    </div>
  </div>
</div>
