<div id="page-tempo" class="page">
  <h1 class="page-title">⏱️ Tempo</h1>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('tempo','sync')">Sync</div>
    <div class="tab" onclick="switchTab('tempo','borrar')">Borrar</div>
    <div class="tab" onclick="switchTab('tempo','consultar')">Consultar</div>
  </div>

  <!-- Tab: Sync (Preview + Cargar) -->
  <div id="tempo-sync" class="tab-panel active">
    <div class="card">
      <div class="form-row">
        <div><label>Desde</label><input type="date" id="tempoSyncFrom"></div>
        <div><label>Hasta</label><input type="date" id="tempoSyncTo"></div>
        <div><label>&nbsp;</label><button class="btn btn-primary" onclick="tempoPreview()">Preview</button></div>
      </div>
    </div>
    <div id="tempo-preview"></div>
  </div>

  <!-- Tab: Borrar -->
  <div id="tempo-borrar" class="tab-panel">
    <div class="card">
      <div class="form-row">
        <div><label>Desde</label><input type="date" id="tempoDeleteFrom"></div>
        <div><label>Hasta</label><input type="date" id="tempoDeleteTo"></div>
        <div><label>&nbsp;</label><button class="btn btn-danger" onclick="tempoDeleteRangeUI()">Borrar worklogs</button></div>
      </div>
    </div>
    <div id="tempo-delete-results"></div>
  </div>

  <!-- Tab: Consultar -->
  <div id="tempo-consultar" class="tab-panel">
    <div class="card">
      <div class="form-row">
        <div><label>Desde</label><input type="date" id="tempoViewFrom"></div>
        <div><label>Hasta</label><input type="date" id="tempoViewTo"></div>
        <div><label>&nbsp;</label><button class="btn btn-primary" onclick="viewWorklogs()">Consultar</button></div>
      </div>
    </div>
    <div id="tempo-worklogs"></div>
  </div>
</div>
